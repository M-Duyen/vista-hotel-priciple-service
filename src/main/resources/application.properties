spring.application.name=principle-service

server.port=8089

spring.datasource.url=jdbc:mariadb://localhost:3306/principledb
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456789}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.jackson.serialization.write-dates-as-timestamps=false

# Eureka client configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Room service validation client
room.service.base-url=${ROOM_SERVICE_BASE_URL:lb://room-service}
room.service.room-types-path=${ROOM_SERVICE_ROOM_TYPES_PATH:/api/room-types}
room.service.connect-timeout-ms=${ROOM_SERVICE_CONNECT_TIMEOUT_MS:3000}
room.service.read-timeout-ms=${ROOM_SERVICE_READ_TIMEOUT_MS:3000}

app.jwt.secret=${APP_JWT_SECRET:my-ultra-secret-key-that-is-very-long-and-secure-for-jwt-signing-purpose-2024}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

